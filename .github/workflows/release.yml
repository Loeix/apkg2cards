name: build-windows

# Se lance quand tu publies une "Release" sur GitHub (ou à la main depuis l'onglet Actions)
#  - version stable : tag v0.4.0, release normale
#  - version bêta   : tag v0.4.0-beta.1, release cochée "Set as a pre-release"
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le type de release (stable ou bêta)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $isBeta = $tag.Contains("-")
          $flag = "${{ github.event.release.prerelease }}" -eq "true"
          if ($isBeta -ne $flag) {
            Write-Error "Le tag $tag et la case 'pre-release' ne correspondent pas : un tag avec un tiret (ex. v0.4.0-beta.1) doit être coché 'pre-release', une version stable ne doit pas l'être."
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --windowed --name apkg2cards --icon assets/icon.ico --exclude-module tkinter --collect-submodules apkg2cards run_gui.py
      - run: choco install innosetup -y --no-progress

      - name: Lire la version du code
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/get_version.py
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Vérifier que le tag correspond à la version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}" -replace '^v\.?', ''
          if ($tag -ne "${{ steps.ver.outputs.version }}") {
            Write-Error "Le tag ($tag) ne correspond pas à __version__ (${{ steps.ver.outputs.version }})"
            exit 1
          }

      - name: Construire l'installateur
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss'

      - name: Calculer la somme de contrôle (vérifiée par la mise à jour automatique)
        shell: pwsh
        run: |
          $h = (Get-FileHash installer/apkg2cards-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  apkg2cards-setup.exe" | Out-File -Encoding ascii installer/apkg2cards-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: apkg2cards-setup
          path: installer/*

      - name: Joindre l'installateur à la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/apkg2cards-setup.exe
            installer/apkg2cards-setup.exe.sha256
