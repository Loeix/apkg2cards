name: build-windows

# Se lance quand tu publies une "Release" sur GitHub (ou à la main depuis l'onglet Actions)
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --windowed --name apkg2cards --icon assets/icon.ico --exclude-module tkinter --collect-submodules apkg2cards run_gui.py
      - run: choco install innosetup -y --no-progress
      - name: Lire la version du code
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/get_version.py
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Vérifier que le tag correspond à la version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          if ("${{ github.event.release.tag_name }}" -ne "v${{ steps.ver.outputs.version }}") {
            Write-Error "Le tag ne correspond pas à __version__ dans le code"
            exit 1
          }
      - name: Construire l'installateur
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: apkg2cards-setup
          path: installer/apkg2cards-setup.exe
      - name: Joindre l'installateur à la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/apkg2cards-setup.exe
